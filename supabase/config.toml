project_id = "tickshow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
# Signup creates customer accounts only. Administrator roles require a signed
# invitation and are assigned by database functions, never by the browser.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
